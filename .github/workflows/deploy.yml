name: Deploy to Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sidefyn.ch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}

      # Uploads dist/ to the document root "site/" of the sidefyn.ch webspace on
      # avitus.sui-inter.net (Plesk). Only changed files are transferred; the
      # sync state is kept on the server in .ftp-deploy-sync-state.json.
      - name: Upload to Plesk via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: avitus.sui-inter.net
          protocol: ftps
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./dist/
          server-dir: site/
