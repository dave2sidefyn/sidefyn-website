name: Deploy to Plesk

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://sidefyn.ch
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          PUBLIC_GOOGLE_MAPS_API_KEY: ${{ secrets.PUBLIC_GOOGLE_MAPS_API_KEY }}

      # Uploads dist/ to the document root "site/" of the sidefyn.ch webspace on
      # avitus.sui-inter.net (Plesk) over FTPS. lftp is used because ProFTPD on Plesk
      # requires TLS session reuse on data connections. --delete removes files that
      # are no longer part of the build.
      - name: Upload to Plesk via FTPS
        env:
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          sudo apt-get update -qq > /dev/null && sudo apt-get install -y -qq lftp > /dev/null
          lftp -u "$FTP_USERNAME,$FTP_PASSWORD" avitus.sui-inter.net <<'LFTP'
          set ftp:ssl-force true
          set ftp:ssl-protect-data true
          set ssl:verify-certificate true
          set net:max-retries 2
          mirror --reverse --delete --verbose=1 --parallel=4 dist/ site/
          bye
          LFTP
